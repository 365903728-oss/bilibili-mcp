name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # 必须：用于 OIDC 握手
      contents: read       # 必须：用于读取代码
    steps:
      # v4 resolved from the official actions/checkout repository on 2026-07-30.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # v4 resolved from the official actions/setup-node repository on 2026-07-30.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org/'
          scope: '@xzxzzx'  # 重要：添加 scope 配置

      - name: Install npm with trusted publishing support (>=11.5.1)
        run: npm install -g npm@11.18.0

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Publish to npm
        run: npm publish --provenance --access public
